<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EmptyInbox.me icon — Capture">
  <!--
    CAPTURE: Three lines converging from above to a single teal dot.
    Metaphor: emails/signals collected at one endpoint.
    Precise, directional, developer-native (like a data pipeline).
  -->
  <line x1="5"  y1="4" x2="16" y2="22" stroke="#1e2533" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="16" y1="4" x2="16" y2="22" stroke="#1e2533" stroke-width="2"   stroke-linecap="round" opacity="0.75"/>
  <line x1="27" y1="4" x2="16" y2="22" stroke="#1e2533" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <circle cx="16" cy="27" r="3.5" fill="#10b981"/>
</svg>
