<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EmptyInbox.me icon — Ring">
  <!--
    DASHED RING: A circle with a dashed stroke — impermanent, placeholder, temporary.
    One solid teal dot at the center — a single email, held briefly.
    Metaphor: an ephemeral container. The dashes signal its disposable nature.
    Developer visual language: dashed = "draft", "optional", "placeholder".
  -->
  <circle cx="16" cy="16" r="12"
          fill="none"
          stroke="#1e2533" stroke-width="2"
          stroke-dasharray="4.5 3"
          stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2.5" fill="#10b981"/>
</svg>
