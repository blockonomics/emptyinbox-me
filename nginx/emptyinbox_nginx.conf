# Rate limit zones. Registration is the abuse magnet: agents auto-register on
# first run, and a single IP has hammered it for hours before now. The Flask
# limiter is per-process and in-memory, so the real cap belongs here.
limit_req_zone $binary_remote_addr zone=register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=payments:10m rate=30r/m;

# The Blockonomics callback carries the shared secret as a query parameter, so
# the default access log would archive it. $uri is the path without the query.
log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $uri $server_protocol" $status '
                  '$body_bytes_sent "$http_referer" "$http_user_agent"';

# Cache lifetimes live in a map rather than in per-location add_header lines:
# a location that sets any add_header discards every add_header inherited from
# the server block, which would silently drop HSTS on exactly the URLs that
# needed a cache rule. One map, one add_header, no inheritance surprises.
#
#   fonts   - filenames are content hashes, never rewritten in place
#   assets  - replaced under the same name now and then, so a month is the cap
#   css/js  - edited in place and unfingerprinted; a long TTL strands clients
#   default - HTML, sitemap, robots: always revalidate
map $uri $cache_control {
    default          "public, max-age=0, must-revalidate";
    ~^/fonts/        "public, max-age=31536000, immutable";
    ~^/assets/       "public, max-age=2592000";
    ~\.(?:css|js)$   "public, max-age=3600, must-revalidate";
}

# Anything that is not emptyinbox.me gets dropped rather than served. The box
# used to answer on every hostname pointed at it, which let a stray DNS record
# publish a byte-identical copy of the site for search engines to index.
server {
    server_name _;
    listen 80 default_server;
    listen 443 default_server ssl;
    ssl_certificate /home/ubuntu/emptyinbox.crt;
    ssl_certificate_key /home/ubuntu/emptyinbox.key;
    return 444;
}

# Canonical host is the apex. www exists only to redirect onto it.
server {
    server_name www.emptyinbox.me;
    listen 80;
    listen 443 ssl;
    ssl_certificate /home/ubuntu/emptyinbox.crt;
    ssl_certificate_key /home/ubuntu/emptyinbox.key;
    return 301 https://emptyinbox.me$request_uri;
}

server {
    server_name emptyinbox.me;
    listen 80;
    return 301 https://emptyinbox.me$request_uri;
}

server {
    server_name emptyinbox.me;
    # The http2 parameter on listen is deprecated in nginx 1.25.1+ in favour of
    # a separate `http2 on;` directive, but it still works there and is the
    # only form older nginx understands. Swap it if the deprecation warning at
    # `nginx -t` becomes noise.
    listen 443 ssl http2;
    ssl_certificate /home/ubuntu/emptyinbox.crt;
    ssl_certificate_key /home/ubuntu/emptyinbox.key;
    root /home/ubuntu/emptyinbox-me/static;
    index index.html;

    # Every route on the canonical host is TLS-only via the redirects above,
    # so the browser may as well stop trying port 80. No includeSubDomains:
    # the mail host is not covered by this certificate.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml application/yaml
               image/svg+xml application/rss+xml;

    # This nginx is the edge, so there is no upstream proxy whose forwarding
    # headers are worth keeping. Overwrite them instead of appending: with
    # $proxy_add_x_forwarded_for a client-supplied value stays at the head of
    # the list, which is exactly the position the app reads.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Defining any proxy_set_header here discards nginx's default set,
    # so restate the Connection default rather than silently changing
    # how upstream connections are closed.
    proxy_set_header Connection close;

    # Serve .well-known/passkey-endpoints with correct MIME type.
    # The security headers are restated because this block sets add_header.
    location = /.well-known/passkey-endpoints {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $cache_control always;
        try_files $uri =404;
    }

    # Serve other .well-known files normally
    location ~ ^/.well-known/ {
        try_files $uri =404;
    }

    # Allow agents and tools to fetch the OpenAPI spec cross-origin
    location = /openapi.yaml {
        add_header Access-Control-Allow-Origin *;
        add_header Content-Type "application/yaml";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $cache_control always;
    }

    # Allow agents to fetch llms.txt cross-origin
    location = /llms.txt {
        add_header Access-Control-Allow-Origin *;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $cache_control always;
    }

    # Registration: 3/min with a small burst, matching the app's intent.
    location = /api/auth/register {
        limit_req zone=register burst=3 nodelay;
        limit_req_status 429;
        rewrite (^/api)(.*) $2 break;
        proxy_pass http://localhost:5000;
        proxy_pass_request_headers on;
    }

    # Quoting derives a fresh BTC address each time and advances the xPub
    # index. Loose enough for honest polling, tight enough to protect the
    # wallet gap limit.
    location ~ ^/api/payments/(quote|monitor) {
        limit_req zone=payments burst=10 nodelay;
        limit_req_status 429;
        rewrite (^/api)(.*) $2 break;
        proxy_pass http://localhost:5000;
        proxy_pass_request_headers on;
    }

    # Payment callback: proxied like any API route, but logged without the
    # query string so the callback secret stays out of the access log.
    location = /api/payments/callback {
        access_log /var/log/nginx/access.log masked;
        rewrite (^/api)(.*) $2 break;
        proxy_pass http://localhost:5000;
        proxy_pass_request_headers on;
    }

    # Proxy API requests to Flask backend
    location /api {
        rewrite (^/api)(.*) $2 break;
        proxy_pass http://localhost:5000;
        proxy_pass_request_headers on;
    }
}
