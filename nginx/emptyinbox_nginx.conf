# Rate limit zones. Registration is the abuse magnet: agents auto-register on
# first run, and a single IP has hammered it for hours before now. The Flask
# limiter is per-process and in-memory, so the real cap belongs here.
limit_req_zone $binary_remote_addr zone=register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=payments:10m rate=30r/m;

# Concurrency cap rather than a request-rate cap for ordinary browsing. A page
# load pulls twenty-odd component files, so a per-minute request limit would
# throttle real visitors long before it inconvenienced a scanner. Connections
# are the resource actually worth protecting.
limit_conn_zone $binary_remote_addr zone=perip:10m;

# The Blockonomics callback carries the shared secret as a query parameter, so
# the default access log would archive it. $uri is the path without the query.
log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $uri $server_protocol" $status '
                  '$body_bytes_sent "$http_referer" "$http_user_agent"';

# Cache lifetimes live in a map rather than in per-location add_header lines:
# a location that sets any add_header discards every add_header inherited from
# the server block, which would silently drop HSTS on exactly the URLs that
# needed a cache rule. One map, one add_header, no inheritance surprises.
#
#   fonts   - filenames are content hashes, never rewritten in place
#   assets  - replaced under the same name now and then, so a month is the cap
#   css/js  - edited in place and unfingerprinted; a long TTL strands clients
#   default - HTML, sitemap, robots: always revalidate
map $uri $cache_control {
    default          "public, max-age=0, must-revalidate";
    ~^/fonts/        "public, max-age=31536000, immutable";
    ~^/assets/       "public, max-age=2592000";
    ~\.(?:css|js)$   "public, max-age=3600, must-revalidate";
}

# Anything that is not emptyinbox.me gets dropped rather than served. The box
# used to answer on every hostname pointed at it, which let a stray DNS record
# publish a byte-identical copy of the site for search engines to index. It
# also handed every IPv4 scanner a real 200 instead of a closed connection.
server {
    server_name _;
    listen 80 default_server;
    listen 443 default_server ssl;
    ssl_certificate /home/ubuntu/emptyinbox.crt;
    ssl_certificate_key /home/ubuntu/emptyinbox.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 444;
}

# Canonical host is the apex. www exists only to redirect onto it.
server {
    server_name www.emptyinbox.me;
    listen 80;
    listen 443 ssl;
    ssl_certificate /home/ubuntu/emptyinbox.crt;
    ssl_certificate_key /home/ubuntu/emptyinbox.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://emptyinbox.me$request_uri;
}

server {
    server_name emptyinbox.me;
    listen 80;
    server_tokens off;
    return 301 https://emptyinbox.me$request_uri;
}

server {
    server_name emptyinbox.me;
    # The http2 parameter on listen is deprecated in nginx 1.25.1+ in favour of
    # a separate `http2 on;` directive, but it still works there and is the
    # only form older nginx understands. Swap it if the deprecation warning at
    # `nginx -t` becomes noise.
    listen 443 ssl http2;
    ssl_certificate /home/ubuntu/emptyinbox.crt;
    ssl_certificate_key /home/ubuntu/emptyinbox.key;
    root /home/ubuntu/emptyinbox-me/static;
    index index.html;

    # http{} in nginx.conf still enables TLSv1 and TLSv1.1 for every site on
    # this box. Overriding per-server fixes this vhost without touching the
    # unrelated sites that share that file.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:emptyinbox:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Scanners fingerprint by version string before picking an exploit. There
    # is no reason to answer that question.
    server_tokens off;

    # Inbound mail is the only large body this vhost accepts, and it gets its
    # own limit below. Everything else is small JSON.
    client_max_body_size 1m;

    # Slow-request defences. A stalled client should not hold a worker slot
    # open indefinitely; worker_connections is 768 for the whole box.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    limit_conn perip 24;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml application/yaml
               image/svg+xml application/rss+xml;

    # This nginx is the edge, so there is no upstream proxy whose forwarding
    # headers are worth keeping. Overwrite them instead of appending: with
    # $proxy_add_x_forwarded_for a client-supplied value stays at the head of
    # the list, which is exactly the position the app reads.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Defining any proxy_set_header here discards the default set, so restate
    # the Connection default rather than silently changing how upstream
    # connections are closed.
    proxy_set_header Connection close;

    # Serve .well-known/passkey-endpoints with correct MIME type.
    # The security headers are restated because this block sets add_header.
    location = /.well-known/passkey-endpoints {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control $cache_control always;
        try_files $uri =404;
    }

    # Serve other .well-known files normally
    location ~ ^/.well-known/ {
        try_files $uri =404;
    }

    # Everything else beginning with a dot is refused. Nothing under the
    # docroot needs it, and this is the standing guard against an .env, a .git
    # checkout, or an editor swap file ever landing in static/ and being
    # served. Regex locations match in file order, so this must stay BELOW the
    # two .well-known blocks above or it would swallow them.
    location ~ /\. {
        return 404;
    }

    # The docroot is static HTML, CSS and JS. A request for a server-side
    # script is a probe by definition; the observed scan traffic is almost
    # entirely WordPress and PHP paths. Drop the connection rather than
    # spending a 404 on it.
    location ~* \.(php|phtml|asp|aspx|jsp|cgi|pl|sh|sql|bak|old|swp|env)$ {
        return 444;
    }

    # Allow agents and tools to fetch the OpenAPI spec cross-origin
    location = /openapi.yaml {
        add_header Access-Control-Allow-Origin *;
        add_header Content-Type "application/yaml";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control $cache_control always;
    }

    # Allow agents to fetch llms.txt cross-origin
    location = /llms.txt {
        add_header Access-Control-Allow-Origin *;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control $cache_control always;
    }

    # Inbound mail from the local Postfix pipe. process_email.py posts the
    # parsed text and HTML bodies here, which can run to a few hundred KB on a
    # marketing email, so this route needs a larger cap than the rest. It
    # authenticates on the shared secret in the Authorization header.
    location = /api/email {
        client_max_body_size 10m;
        rewrite (^/api)(.*) $2 break;
        proxy_pass http://localhost:5000;
        proxy_pass_request_headers on;
    }

    # Registration: 3/min with a small burst, matching the app's intent.
    location = /api/auth/register {
        limit_req zone=register burst=3 nodelay;
        limit_req_status 429;
        rewrite (^/api)(.*) $2 break;
        proxy_pass http://localhost:5000;
        proxy_pass_request_headers on;
    }

    # Quoting derives a fresh BTC address each time and advances the xPub
    # index. Loose enough for honest polling, tight enough to protect the
    # wallet gap limit.
    location ~ ^/api/payments/(quote|monitor) {
        limit_req zone=payments burst=10 nodelay;
        limit_req_status 429;
        rewrite (^/api)(.*) $2 break;
        proxy_pass http://localhost:5000;
        proxy_pass_request_headers on;
    }

    # Payment callback: proxied like any API route, but logged without the
    # query string so the callback secret stays out of the access log.
    location = /api/payments/callback {
        access_log /var/log/nginx/access.log masked;
        rewrite (^/api)(.*) $2 break;
        proxy_pass http://localhost:5000;
        proxy_pass_request_headers on;
    }

    # Proxy API requests to Flask backend. Prefix match, so /apifoo also lands
    # here and reaches Flask as /foo; Flask answers 404 and nothing leaks.
    location /api {
        rewrite (^/api)(.*) $2 break;
        proxy_pass http://localhost:5000;
        proxy_pass_request_headers on;
    }
}
